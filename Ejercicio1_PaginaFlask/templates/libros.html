{% extends 'base.html' %}
{% block titulo %}Libros{% endblock %}
{% block contenido %}
<h2>Catálogo de libros</h2>
<table class="table table-striped table-bordered">
    <thead>
        <tr>
            <th>Id</th><th>Título</th><th>Autor</th><th>Edición</th>
            <th>Año</th><th>Editorial</th><th>No. Páginas</th><th></th>
        </tr>
    </thead>
    <tbody>
        {% for l in libros %}
        <tr>
            <td>{{ l[0] }}</td><td>{{ l[1] }}</td><td>{{ l[2] }}</td><td>{{ l[3] }}</td>
            <td>{{ l[4] }}</td><td>{{ l[5] }}</td><td>{{ l[6] }}</td>
            <td><a class="btn btn-sm btn-secondary" href="{{ url_for('libro', id=l[0]) }}">Detalle</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
